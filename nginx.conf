worker_processes auto;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Gzip sıkıştırma (JSON response'ları için)
    gzip on;
    gzip_types application/json text/plain text/html;
    gzip_min_length 1000;

    # Rate limiting — IP başına saniyede 15 istek
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
    # Arama için daha sıkı limit
    limit_req_zone $binary_remote_addr zone=search_limit:10m rate=5r/s;

    # Dosya upload boyutu (büyük şarkı yüklemeleri için)
    client_max_body_size 200M;

    # Proxy buffer boyutları (büyük stream response'ları için)
    proxy_buffering off; # Stream için buffering kapalı
    proxy_request_buffering off;

    # Backend hedefi
    upstream ringtone_backend {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name music.cevapla.tv;

        # === Cloudflare gerçek IP (domain + Cloudflare ekleyince aç) ===
        set_real_ip_from 173.245.48.0/20;
        set_real_ip_from 103.21.244.0/22;
        set_real_ip_from 103.22.200.0/22;
        set_real_ip_from 103.31.4.0/22;
        set_real_ip_from 141.101.64.0/18;
        set_real_ip_from 108.162.192.0/18;
        set_real_ip_from 190.93.240.0/20;
        set_real_ip_from 188.114.96.0/20;
        set_real_ip_from 197.234.240.0/22;
        set_real_ip_from 198.41.128.0/17;
        set_real_ip_from 162.158.0.0/15;
        set_real_ip_from 104.16.0.0/13;
        set_real_ip_from 104.24.0.0/14;
        set_real_ip_from 172.64.0.0/13;
        set_real_ip_from 131.0.72.0/22;
        real_ip_header CF-Connecting-IP;

        # Proxy header'ları
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;

        # === PERFORMANS: Media dosyalarını Nginx direkt sunsun (Node.js'e yük bindirmez) ===
        # cache-panel'den erişilen dosyalar buradan gelir
        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            add_header Accept-Ranges bytes;

            # CORS header'ları (Android uygulaması için)
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        }

        # Health check — rate limit yok
        location /health {
            proxy_pass http://ringtone_backend;
        }

        # Admin anasayfa
        location /admin {
            proxy_pass http://ringtone_backend;
        }

        # GitHub Webhook — admin panel auto-deploy
        location /webhook/deploy {
            proxy_pass http://127.0.0.1:9000/deploy;
            proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
            proxy_set_header Content-Type $content_type;
        }
        # Cache panel ve admin — rate limit yok
        location /cache-panel {
            proxy_pass http://ringtone_backend;
        }
        location /proxy-panel {
            proxy_pass http://ringtone_backend;
        }

        # Arama — sıkı rate limit
        location /search {
            limit_req zone=search_limit burst=10 nodelay;
            proxy_pass http://ringtone_backend;
        }

        # Stream endpoint'leri — proxy buffering kapalı (gerçek zamanlı stream)
        location /stream {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://ringtone_backend;
            proxy_buffering off;
            proxy_read_timeout 300s; # 5 dk timeout (uzun şarkılar için)
        }

        # Download endpoint'leri
        location /download {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://ringtone_backend;
            proxy_buffering off;
            proxy_read_timeout 600s; # 10 dk timeout (video indirmeleri için)
        }

        # Video stream
        location /video {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://ringtone_backend;
            proxy_buffering off;
            proxy_read_timeout 600s;
        }

        # Diğer tüm istekler
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://ringtone_backend;
        }
    }
}
